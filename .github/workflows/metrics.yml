name: Metrics

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Hgt1-0
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kuala_Lumpur
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_colors: "0:#D4AF37, 1:#8E5BD1, 2:#6A2FB0, 3:#B79BE6, 4:#3E1F6E, 5:#E9E3F5"
          extras_css: |
            svg { color: #9A8BB8 !important; }
            h1, h2, h3 { color: #D4AF37 !important; }
            .field svg { fill: #8E5BD1 !important; }
            a { color: #B79BE6 !important; }
            .calendar rect.day { fill: #8E5BD1 !important; }
            .calendar rect.day[fill="#ebedf0"] { fill: #2A1748 !important; }
